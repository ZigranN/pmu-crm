name: pmu-crm-tests
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: pmu_test
      POSTGRES_USER: pmu_test
      POSTGRES_PASSWORD: local-only
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pmu_test -d pmu_test']
      interval: 2s
      timeout: 5s
      retries: 15
